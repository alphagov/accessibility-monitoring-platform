services:
  db:
    image: postgres:18.6
    restart: always
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
      PGDATA: /var/lib/postgresql/data
    volumes:
      - ../data/postgres-data-full-stack:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
      platform: linux/amd64
      build:
          context: ..
          dockerfile: Dockerfiles/amp_platform.DockerFile
      image: "amp_platform"
      ports:
          - "8001:8001"
      depends_on:
          - db
          - localstack
      environment:
          - ALLOWED_HOSTS='* localhost 0.0.0.0 0.0.0.0:8001 web web:8001' # Only localhost:8001 works for localstack
          - SECRET_KEY='123456789'
          - DEBUG=FALSE
          - INTEGRATION_TEST=FALSE
          - TERRAFORM=TRUE
          - DB_HOST=db
          - DB_NAME=postgres
          - DB_USER=admin
          - BUCKET_NAME=amp-app-prod-env-prod-env-files
          - 'DB_PASSWORD={"username": "admin", "password": "secret"}'
      healthcheck:
          test: curl --fail http://localhost:8001/healthcheck || exit 1
      stdin_open: true
      tty: true
  
  report_viewer:
    platform: linux/amd64
    build:
        context: ..
        dockerfile: Dockerfiles/amp_viewer.DockerFile
    image: "amp_viewer"
    ports:
        - "8002:8001"
    depends_on:
        - db
        - localstack
        - web
    environment:
        - ALLOWED_HOSTS='* localhost 0.0.0.0 0.0.0.0:8001'
        - SECRET_KEY='123456789'
        - DEBUG=FALSE
        - INTEGRATION_TEST=FALSE
        - TERRAFORM=TRUE
        - DB_HOST=db
        - DB_NAME=postgres
        - DB_USER=admin
        - BUCKET_NAME=amp-app-prod-env-prod-env-files
        - 'DB_PASSWORD={"username": "admin", "password": "secret"}'

  localstack:
    image: localstack/localstack:4.14
    hostname: localstack
    ports:
      - "4566:4566"
      - "4571:4571"
    environment:
      - SERVICES=s3
      - AWS_DEFAULT_REGION=us-east-1
      - HOSTNAME_EXTERNAL=localstack
      - DATA_DIR=${LOCALSTACK_DATA_DIR:-/tmp/localstack/data}
    volumes:
      - "../data/localstack-data:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"

volumes:
  db-data:
  pgadmin-data:
