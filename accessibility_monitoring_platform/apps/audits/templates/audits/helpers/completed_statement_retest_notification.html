{% if statement_audit.is_retest_complete %}
    <div class="govuk-grid-row">
        <div class="govuk-grid-column-full">
            <div class="govuk-notification-banner {% if case.case_completed == 'complete-no-send' %}govuk-notification-banner--success{% endif %}" role="region" aria-labelledby="banner-title-compliant-website" data-module="govuk-notification-banner">
                <div class="govuk-notification-banner__header">
                    <h2 class="govuk-notification-banner__title" id="banner-title-compliant-website">
                        Important
                    </h2>
                </div>
                <div class="govuk-notification-banner__content">
                    <h3 class="govuk-notification-banner__heading amp-max-width-100">
                        This test has been marked as completed.
                    </h3>
                    <p class="govuk-body">
                        Start a
                        <a class="govuk-notification-banner__link" href="{% url 'audits:next-twelve-week-statement-retest' statement_audit.id %}">
                        New retest</a></p>
                </div>
            </div>
        </div>
    </div>
{% endif %}
